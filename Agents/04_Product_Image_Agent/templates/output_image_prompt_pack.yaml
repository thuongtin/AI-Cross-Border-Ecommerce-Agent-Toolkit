# Template đầu ra · Gói Prompt hình ảnh
# Cấu trúc đầu ra chuẩn của 04 Product Image Agent
# Script ra ảnh có thể đọc trực tiếp (định dạng YAML, tên trường cố định)

meta:
  product_name: ""
  platform: ""                 # shopee | mercadolivre | amazon | tiktokshop | shopify
  target_market: ""
  mode: ""                     # standard | variant | iterate
  generated_at: ""             # YYYY-MM-DD
  prompt_version: "04-Product-Image v0.1"
  upstream: "03-Listing-Creative"   # Module upstream, bắt buộc là 03

# ─────────────────────────────────────────────
# 1. Kế hoạch nội dung 9 ảnh
# ─────────────────────────────────────────────
image_plan:
  - slot: 1
    role: "Ảnh chính"
    message: ""                # Thông tin duy nhất mà ảnh này truyền tải
    info_type: "Nhận diện"      # Nhận diện | Thuyết phục | Thông tin | Nhập vai | Xóa nghi ngờ | Niềm tin
    composition: ""            # Mô tả thành phần khung hình
    copy: null                 # Text, không có chữ thì null
    copy_chars: 0

  - slot: 2
    role: "Ảnh điểm bán hàng chủ lực"
    message: ""                # = core_selling_point
    info_type: "Thuyết phục"
    composition: ""
    copy: ""
    copy_chars: 0

  - slot: 3
    role: "Ảnh thông số kỹ thuật"
    message: ""
    info_type: "Thông tin"
    type: "layout"             # ← layout = ảnh dàn trang thiết kế, không phải ảnh AI
    composition: ""
    copy: ""
    copy_chars: 0

  - slot: 4
    role: "Ảnh bối cảnh sử dụng A"
    message: ""                # = usage_scope_confirmed[0]
    info_type: "Nhập vai"
    composition: ""
    copy: ""
    copy_chars: 0

  - slot: 5
    role: "Ảnh bối cảnh sử dụng B"
    message: ""                # = usage_scope_confirmed[1]
    info_type: "Nhập vai"
    composition: ""
    copy: ""
    copy_chars: 0

  - slot: 6
    role: "Ảnh cận cảnh chi tiết"
    message: ""
    info_type: "Thuyết phục"
    composition: ""
    copy: ""
    copy_chars: 0

  - slot: 7
    role: "Ảnh kích thước/so sánh"
    message: ""
    info_type: "Xóa nghi ngờ"
    type: "layout"             # Có vật tham chiếu, thường là chụp thật + chú thích
    composition: ""
    copy: ""
    copy_chars: 0

  - slot: 8
    role: "Ảnh danh sách đóng gói"
    message: ""
    info_type: "Ngăn tranh chấp"
    type: "photo_required"     # ← Bắt buộc chụp thật, cấm dùng AI tạo
    composition: ""
    copy: ""
    copy_chars: 0

  - slot: 9
    role: "Ảnh hậu mãi/bảo hành"
    message: ""
    info_type: "Niềm tin"
    type: "layout"
    composition: ""
    copy: ""
    copy_chars: 0

# ─────────────────────────────────────────────
# 2. Phương án theo khác biệt sàn (ML / Amazon bắt buộc có)
# ─────────────────────────────────────────────
platform_variant:
  conflict: false              # Có xung đột giữa các sàn hay không
  variants:
    - name: "A"
      platforms: ["mercadolivre", "amazon"]
      main_image_rule: "Nền trắng tinh, không có bất kỳ chữ / watermark / khung viền / đạo cụ nào"
    - name: "B"
      platforms: ["shopee", "tiktokshop"]
      main_image_rule: "Nền trắng + chữ điểm bán hàng (≤2 dòng, mỗi dòng ≤20 ký tự)"
  note: "Cùng một bộ creative ảnh chính không được dùng lại giữa các sàn"

# ─────────────────────────────────────────────
# 3. Prompt ra ảnh
# ─────────────────────────────────────────────
prompts:
  - slot: 1
    role: "Ảnh chính"
    prompt: ""                 # Gồm bảy slot: SUBJECT / MATERIAL / COMPOSITION / LIGHTING / BACKGROUND / STYLE / PARAMETERS
    negative_prompt: ""
    aspect_ratio: "1:1"
    recommended_size: "1024x1024"
    reference_image_needed: true

  - slot: 2
    role: "Ảnh điểm bán hàng chủ lực"
    prompt: ""
    negative_prompt: ""
    aspect_ratio: "1:1"
    recommended_size: "1024x1024"
    reference_image_needed: true

  # slot 3 là layout, không có Prompt ra ảnh, dùng layout_spec thay thế
  - slot: 3
    role: "Ảnh thông số kỹ thuật"
    type: "layout"
    layout_spec:
      size: "1024x1024"
      background: "#FFFFFF"
      title: ""
      rows: []                 # Các dòng thông số, ví dụ ["Capacidade: 20000 mAh", ...]
      font_hint: "Không chân (sans-serif), chiều cao text chính ≥ 4% chiều cao ảnh"
      color_palette: []

  - slot: 4
    role: "Ảnh bối cảnh sử dụng A"
    prompt: ""
    negative_prompt: ""
    aspect_ratio: "1:1"
    recommended_size: "1024x1024"
    portrait_constraint: "Không lộ khuôn mặt có thể nhận diện (bàn tay / bóng lưng / cảnh xa)"

  - slot: 5
    role: "Ảnh bối cảnh sử dụng B"
    prompt: ""
    negative_prompt: ""
    aspect_ratio: "1:1"
    recommended_size: "1024x1024"
    portrait_constraint: "Không lộ khuôn mặt có thể nhận diện"

  - slot: 6
    role: "Ảnh cận cảnh chi tiết"
    prompt: ""
    negative_prompt: ""
    aspect_ratio: "1:1"
    recommended_size: "1024x1024"

  - slot: 7
    role: "Ảnh kích thước/so sánh"
    type: "layout"
    layout_spec:
      size: "1024x1024"
      reference_object: ""     # Vật tham chiếu, ví dụ "mão humana adulta"
      dimensions_label: ""     # Lấy từ spec_table, khớp từng ký tự
      comparison_rule: "Đối tượng so sánh phải là hình dạng chung, không được chỉ đích danh ngoại hình của đối thủ"

  - slot: 8
    role: "Ảnh danh sách đóng gói"
    type: "photo_required"     # ⚠️ Bắt buộc chụp thật
    note: "AI tạo sẽ khiến người mua nhận hàng không đúng mô tả → đánh giá tiêu cực về thiếu phụ kiện"
    shoot_spec:
      layout: "Bày phẳng chụp từ trên xuống"
      items: []                # = package_content, không sót món nào
      must_show_exclusion: true  # Bắt buộc ghi rõ "không có gì"

  - slot: 9
    role: "Ảnh hậu mãi/bảo hành"
    type: "layout"
    layout_spec:
      size: "1024x1024"
      content: []              # Thời hạn bảo hành / phạm vi / kênh CSKH
      forbidden: "Không được tạo đồ họa nhái biểu tượng chính thức của sàn"

# ─────────────────────────────────────────────
# 4. Text trong ảnh (dùng để chèn chữ hậu kỳ, không đưa vào Prompt ra ảnh)
# ─────────────────────────────────────────────
overlay_copy:
  - slot: 1
    main_copy: ""
    sub_copy: ""
    chars: 0
    chars_limit: 20
    position: "Giữa lệch lên trên"
    font_size_hint: "Chiều cao text chính ≥ 4% chiều cao ảnh"
  # ... từng ảnh
overlay_note: "Chữ trong ảnh do công cụ thiết kế chèn ở hậu kỳ, không dùng model tạo ảnh để render (dấu tiếng Bồ Đào Nha rất dễ sai)"

# ─────────────────────────────────────────────
# 5. Quét tuân thủ hình ảnh
# ─────────────────────────────────────────────
compliance_scan:
  I1_fake_certification: {hits: 0, actions: []}
  I2_fake_social_proof: {hits: 0, actions: []}
  I3_unauthorized_brand: {hits: 0, actions: []}
  I4_param_mismatch: {hits: 0, actions: []}
  I5_scene_out_of_scope: {hits: 0, actions: []}
  I6_real_person_portrait: {hits: 0, actions: []}
  I7_absolute_terms: {hits: 0, actions: []}
  I8_comparison_genericized: {hits: 0, actions: []}
  conclusion: ""               # Khi tất cả bằng 0 thì ghi "Quét tuân thủ hình ảnh: không vi phạm"

# ─────────────────────────────────────────────
# 6. Giao cho 05 Product Video Agent
# ─────────────────────────────────────────────
handoff_to_video:
  visual_tone_confirmed: ""
  hero_visual: ""              # Mô tả khung hình ảnh chính → tham chiếu khung hình đầu của video
  key_visual_moments: []       # 2–3 khung hình có sức hút nhất → mục ưu tiên cho storyboard video
  forbidden_words: []          # Chuyển tiếp nguyên trạng, để 05 chặn từ cấm trong phụ đề

# ─────────────────────────────────────────────
# 7. Nhắc nhở trước khi đăng
# ─────────────────────────────────────────────
pre_publish:
  - "Đã kiểm tra lại quy chuẩn ảnh hiện hành của sàn mục tiêu (quy tắc sẽ thay đổi)"
  - "Ảnh 8 đã chụp thật, danh sách đóng gói khớp với thực tế"
  - "Text trong ảnh đã được người soát lại dấu"
  - "Ảnh chính đã làm riêng cho từng sàn (ML không có chữ / Shopee có điểm bán hàng)"
  - "Đã ghi lại số phiên bản Prompt lần này"
