# Template đầu ra · Gói nội dung video
# Cấu trúc đầu ra chuẩn của 05 Product Video Agent

meta:
  product_name: ""
  platform: ""                 # shopee | mercadolivre | amazon | tiktokshop | shopify
  target_market: ""
  mode: ""                     # standard | variant
  production_mode: ""          # ai_generated | real_shoot | mixed
  prompt_version: "05-Product-Video v0.1"
  upstream: ["03-Listing-Creative", "04-Product-Image"]

# ─────────────────────────────────────────────
# 1. Hook
# ─────────────────────────────────────────────
hook:
  candidates:
    - type: ""                 # Đánh thẳng nỗi đau | Đưa kết quả lên trước | Phản trực giác | Đối chiếu gây sốc | Nhập vai bối cảnh
      copy: ""
      visual: ""
  selected: ""
  selected_type: ""
  reason: ""
  source: ""                   # Lấy từ insight review nào

# ─────────────────────────────────────────────
# 2. Kịch bản
# ─────────────────────────────────────────────
scripts:
  - duration: 15
    segments:
      - {stage: "Hook", time: "0-3s", goal: "", content: ""}
      - {stage: "Điểm bán hàng cốt lõi", time: "3-9s", goal: "", content: ""}
      - {stage: "Bối cảnh", time: "9-13s", goal: "", content: ""}
      - {stage: "CTA", time: "13-15s", goal: "", content: ""}
  - duration: 30
    segments:
      - {stage: "Hook", time: "0-3s", goal: "", content: ""}
      - {stage: "Điểm bán hàng 1", time: "3-9s", goal: "", content: ""}
      - {stage: "Điểm bán hàng 2", time: "9-16s", goal: "", content: ""}
      - {stage: "Bối cảnh", time: "16-23s", goal: "", content: ""}
      - {stage: "Thông số/Niềm tin", time: "23-28s", goal: "", content: ""}
      - {stage: "CTA", time: "28-30s", goal: "", content: ""}

# ─────────────────────────────────────────────
# 3. Bảng storyboard
# ─────────────────────────────────────────────
storyboard:
  - shot: 1
    time: "0-3s"
    duration_s: 3
    visual: ""                 # Cụ thể đến mức quay được ngay
    camera: ""                 # Máy tĩnh / Push-in / Bám theo / Quay vòng …
    subtitle: ""               # Phụ đề xem khi tắt tiếng, ≤20 ký tự
    audio: ""                  # Giọng đọc / Âm thanh môi trường / Hiệu ứng âm thanh
    type: "ai"                 # ai | real_shoot
  # ... tiếp tục

# ─────────────────────────────────────────────
# 4. Prompt video AI (các cảnh có type = ai)
# ─────────────────────────────────────────────
video_prompts:
  - shot: 1
    prompt: ""                 # Sáu ô: SUBJECT / ACTION / CAMERA / LIGHTING / ENVIRONMENT / STYLE
    negative_prompt: ""
    aspect_ratio: "1:1"
    duration_s: 3
    motion_intensity: "low"    # low | medium
    generation_mode: "text2video"   # text2video | image2video
    first_frame_prompt: ""     # Khung hình đầu khi dùng image2video
    checks:
      param_consistency: true
      scene_in_scope: true
      no_real_person: true

# ─────────────────────────────────────────────
# 5. Chỉ dẫn quay cảnh người thật (type = real_shoot)
# ─────────────────────────────────────────────
shoot_instructions:
  - shot: 5
    reason: "Liên quan đến chân dung người thật, theo quy tắc V6 chuyển thành chỉ dẫn quay"
    camera_height: ""
    framing: ""                # Cỡ cảnh
    action: ""                 # Thứ tự động tác
    props: []
    location: ""
    note: ""                   # VD: "tránh lộ khuôn mặt có thể nhận diện"
    ai_alternative: ""         # Phương án thay thế không lộ mặt (bàn tay/bóng lưng/cảnh xa)
    ai_alternative_prompt: ""

# ─────────────────────────────────────────────
# 6. Kịch bản lồng tiếng
# ─────────────────────────────────────────────
voiceover:
  language: "pt-BR"
  words_per_second: 2.5
  lines:
    - shot: 1
      time: "0-3s"
      text: ""
      word_count: 0
      cumulative_words: 0
      estimated_seconds: 0
  total_words: 0
  overlaps_time_window: false   # Bắt buộc là false

tts_settings:
  accent: "Português (Brasil)"
  gender: ""
  tone: ""
  speed: 1.0                    # Không vượt quá 1.1
  pauses: "Cuối câu 0,3s / Chuyển cảnh 0,2s"
  diacritics_checked: true      # Đã kiểm tra ã ç õ é ê í ó ú

# ─────────────────────────────────────────────
# 7. Phụ đề
# ─────────────────────────────────────────────
subtitles:
  lines:
    - shot: 1
      time: "0-3s"
      line1: ""
      line2: ""
      chars: 0
      chars_limit: 20
      line_count: 1             # Bắt buộc ≤2
      position: ""
  safe_area_note: "Video dọc tránh 20% phía dưới / 15% phía trên"

silent_test:
  understand_product: true      # Tắt tiếng có hiểu đây là sản phẩm gì không
  understand_selling_point: true
  understand_cta: true
  passed: true                  # Cả ba mục đều true mới tính là đạt

# ─────────────────────────────────────────────
# 8. Yêu cầu kỹ thuật
# ─────────────────────────────────────────────
tech_requirements:
  aspect_ratio: "1:1"           # Hoặc 9:16 / 16:9
  resolution: ""
  bgm_mood: ""
  bgm_license: "Phải dùng nội dung được phép dùng thương mại"   # Bắt buộc ghi chú
  sfx_list: []
  overlay_elements: []          # Đồ họa chèn ở hậu kỳ (vị trí Logo, thẻ thông số)

# ─────────────────────────────────────────────
# 9. Quét tuân thủ video
# ─────────────────────────────────────────────
compliance_scan:
  V1_fake_proof: {hits: 0, actions: []}
  V2_param_mismatch: {hits: 0, actions: []}
  V3_scene_out_of_scope: {hits: 0, actions: []}
  V4_absolute_terms: {hits: 0, actions: []}
  V5_unauthorized_brand: {hits: 0, actions: []}
  V6_real_person_portrait: {hits: 0, actions: []}
  V7_dangerous_demo: {hits: 0, actions: []}
  V8_license_required: {hits: 0, actions: []}
  conclusion: ""                # Khi tất cả bằng 0 thì ghi "Quét tuân thủ video: không có vi phạm"

# ─────────────────────────────────────────────
# 10. Lưu ý trước khi đăng
# ─────────────────────────────────────────────
pre_publish:
  - "Đã căn thời lượng storyboard theo audio lồng tiếng (thời lượng storyboard chỉ là giá trị đề xuất)"
  - "Đã kiểm tra dấu thanh PT-BR (điểm TTS hay đọc sai)"
  - "Đã xác nhận BGM / hiệu ứng âm thanh được phép dùng thương mại"
  - "Tắt tiếng vẫn hiểu được thông tin cốt lõi"
  - "CTA cuối video khớp với title_final"
  - "Đã ghi lại số phiên bản Prompt lần này"
